name=esp32-audio-player
version=0.1.0
author=olerast67
maintainer=olerast67
sentence=Complete audio player engine for ESP32: FLAC, MP3, Ogg Vorbis, WAV, AIFF, DSD, sample-exact gapless, AutoEQ, I2S DAC and Bluetooth output.
paragraph=Plays music from an SD card to an I2S DAC or (with esp32-a2dp-xq) Bluetooth headphones. Decoders: FLAC, MP3 with LAME gapless info, Ogg Vorbis, WAV/RF64, AIFF/AIFC, DSF/DFF as DoP. Sample-exact gapless, CUE sheets, ReplayGain, 10-band parametric EQ with AutoEQ import, crossfeed, limiter, resampler, queue with shuffle and repeat, resume, M3U playlists, tag reading with CP1251 detection, a music library index and a Rockbox-format scrobble log.
category=Signal Input/Output
url=https://github.com/olerast67/esp32-audio-player
architectures=esp32
includes=audio_player.h
